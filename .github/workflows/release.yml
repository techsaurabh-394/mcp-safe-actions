name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
      # Publishes to npm only if you set the repository variable PUBLISH_NPM=true
      # and the secret NPM_TOKEN (see CONTRIBUTING.md).
      - name: Publish to npm
        if: ${{ vars.PUBLISH_NPM == 'true' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
