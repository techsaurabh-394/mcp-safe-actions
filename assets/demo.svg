<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="900" height="486" viewBox="0 0 900 486" role="img" aria-label="Animated terminal showing mcp-safe-actions: the human declines and nothing is deleted, then the token fallback with a single-use token.">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14.5px;white-space:pre}
@keyframes l0{0%,3.33%{opacity:0}4.13%,93%{opacity:1}100%{opacity:0}}.l0{animation:l0 18.0s linear infinite}
@keyframes l1{0%,8.06%{opacity:0}8.86%,93%{opacity:1}100%{opacity:0}}.l1{animation:l1 18.0s linear infinite}
@keyframes l2{0%,12.78%{opacity:0}13.58%,93%{opacity:1}100%{opacity:0}}.l2{animation:l2 18.0s linear infinite}
@keyframes l3{0%,17.50%{opacity:0}18.30%,93%{opacity:1}100%{opacity:0}}.l3{animation:l3 18.0s linear infinite}
@keyframes l4{0%,22.22%{opacity:0}23.02%,93%{opacity:1}100%{opacity:0}}.l4{animation:l4 18.0s linear infinite}
@keyframes l5{0%,26.94%{opacity:0}27.74%,93%{opacity:1}100%{opacity:0}}.l5{animation:l5 18.0s linear infinite}
@keyframes l6{0%,31.67%{opacity:0}32.47%,93%{opacity:1}100%{opacity:0}}.l6{animation:l6 18.0s linear infinite}
@keyframes l7{0%,36.39%{opacity:0}37.19%,93%{opacity:1}100%{opacity:0}}.l7{animation:l7 18.0s linear infinite}
@keyframes l8{0%,41.11%{opacity:0}41.91%,93%{opacity:1}100%{opacity:0}}.l8{animation:l8 18.0s linear infinite}
@keyframes l9{0%,45.83%{opacity:0}46.63%,93%{opacity:1}100%{opacity:0}}.l9{animation:l9 18.0s linear infinite}
@keyframes l10{0%,50.56%{opacity:0}51.36%,93%{opacity:1}100%{opacity:0}}.l10{animation:l10 18.0s linear infinite}
@keyframes l11{0%,55.28%{opacity:0}56.08%,93%{opacity:1}100%{opacity:0}}.l11{animation:l11 18.0s linear infinite}
@keyframes l12{0%,60.00%{opacity:0}60.80%,93%{opacity:1}100%{opacity:0}}.l12{animation:l12 18.0s linear infinite}
@keyframes l13{0%,64.72%{opacity:0}65.52%,93%{opacity:1}100%{opacity:0}}.l13{animation:l13 18.0s linear infinite}
@keyframes l14{0%,69.44%{opacity:0}70.24%,93%{opacity:1}100%{opacity:0}}.l14{animation:l14 18.0s linear infinite}
@keyframes l15{0%,74.17%{opacity:0}74.97%,93%{opacity:1}100%{opacity:0}}.l15{animation:l15 18.0s linear infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{animation:blink 1s steps(1) infinite}
</style>
<rect width="900" height="486" rx="14" fill="#0b1020"/>
<rect width="900" height="38" rx="14" fill="#151a36"/><rect y="24" width="900" height="14" fill="#151a36"/>
<circle cx="24" cy="19" r="6" fill="#ff5f56"/><circle cx="46" cy="19" r="6" fill="#ffbd2e"/><circle cx="68" cy="19" r="6" fill="#27c93f"/>
<text x="450.0" y="24" text-anchor="middle" fill="#8b93a7" style="font-size:13px">npm run demo</text>
<text class="l0" x="28" y="74" fill="#8b93a7"># Client WITH approval prompts (MCP elicitation)</text>
<text class="l1" x="28" y="100" fill="#e6e8ee">Model   calls delete_file { name: &quot;report.pdf&quot; }</text>
<text class="l2" x="28" y="126" fill="#6ea8fe">Human   sees a prompt:</text>
<text class="l3" x="28" y="152" fill="#c8cede">        Permanently delete &quot;report.pdf&quot;  -  This cannot be undone.</text>
<text class="l4" x="28" y="178" fill="#c8cede">        Approve this action?</text>
<text class="l5" x="28" y="204" fill="#ff9d9d">Human   declines</text>
<text class="l6" x="28" y="230" fill="#7ee2b8">Server  The user did not approve. Nothing was changed.</text>
<text class="l7" x="28" y="256" fill="#7ee2b8">Check   report.pdf still exists: true</text>
<text class="l8" x="28" y="282" fill="#8b93a7"># Client WITHOUT prompts (one-time token fallback)</text>
<text class="l9" x="28" y="308" fill="#e6e8ee">Model   calls delete_file { name: &quot;old-notes.txt&quot; }</text>
<text class="l10" x="28" y="334" fill="#7ee2b8">Server  NOTHING HAS BEEN CHANGED YET. Token issued.</text>
<text class="l11" x="28" y="360" fill="#e6e8ee">Model   asks the user, then calls again with the token</text>
<text class="l12" x="28" y="386" fill="#7ee2b8">Server  Deleted old-notes.txt</text>
<text class="l13" x="28" y="412" fill="#e6e8ee">Model   tries to reuse the same token</text>
<text class="l14" x="28" y="438" fill="#ff9d9d">Server  Not approved: that token is not valid.</text>
<text class="l15" x="28" y="464" fill="#8b93a7">Audit   previewed -&gt; approved -&gt; executed -&gt; rejected</text>
<text class="cur" x="28" y="472" fill="#6ea8fe">_</text>
</svg>